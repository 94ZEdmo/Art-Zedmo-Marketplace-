<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ART-ZEDMO</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Instrument+Serif:ital@1&display=swap');.serif{font-family:'Instrument Serif',serif}</style>
</head><body class="bg-[#F9F7F2]">
<div id="annonceBar" class="bg-black text-white text-sm py-2 px-4 flex justify-between"><span id="annonceText">🏛️ EXPO OCT 2026 - Ouverture soumissions 01 Oct</span><button onclick="this.parentElement.remove()">✕</button></div>
<nav class="bg-white border-b p-3 flex justify-between max-w-7xl mx-auto"><div class="font-bold text-xl">ART<span class="serif italic">-ZEDMO</span></div><div class="flex gap-4 text-sm"><a href="index.html">Accueil</a><a href="galerie.html">Galerie</a><a href="exposition.html">Expos</a><a href="encheres.html">Enchères</a><a href="compte.html">Compte</a><a href="admin/dashboard.html">Admin</a></div></nav>
<div class="max-w-7xl mx-auto p-4">
<div class="bg-black text-white rounded-[24px] p-10"><h1 class="serif text-6xl">L'art africain<br><i class="text-yellow-400">sans frontière.</i></h1><p class="mt-3 opacity-70">Marketplace + Expositions + Votes + Enchères</p><a href="galerie.html" class="inline-block mt-5 bg-white text-black px-6 py-3 rounded-full font-bold">Explorer</a></div>
<h2 class="serif text-2xl mt-8 mb-3">Exposition du mois</h2><div id="expo" class="bg-white border rounded-[20px] p-4"></div>
<h2 class="serif text-2xl mt-8 mb-3">Populaires 🔥</h2><div id="pop" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</div>
<script>
const arts=[{id:1,t:"Beauté africaine",c:"Peinture",p:"150k FCFA",v:124,img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},{id:2,t:"Renaissance",c:"Sculpture",p:"320k",v:89,img:"https://images.unsplash.com/photo-1554907984-15263bfd63bd?w=400"},{id:3,t:"Lumière Abidjan",c:"Photo",p:"80k",v:210,img:"https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=400"}];
document.getElementById('pop').innerHTML=arts.map(a=>`<a href="oeuvre.html?id=${a.id}" class="bg-white border rounded-xl overflow-hidden"><img src="${a.img}" class="h-36 w-full object-cover"><div class="p-2"><div class="font-bold text-sm">${a.t}</div><div class="text-xs opacity-60">${a.c} • ${a.p} • ${a.v} votes</div></div></a>`).join('');
document.getElementById('expo').innerHTML=`<div class="font-bold">COLLECTIVE OCT 2026 - Beauté Africaine</div><p class="text-sm opacity-60">24 oeuvres • Fin vote dans 5j • <a href="exposition.html" class="underline">Voter</a></p>`;
const ann=localStorage.getItem('zedmo_annonce'); if(ann) document.getElementById('annonceText').innerText=ann;
</script></body></html>
