<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expos</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#F9F7F2]"><nav class="bg-white border-b p-3"><a href="index.html" class="font-bold">← ART-ZEDMO</a></nav>
<div class="max-w-7xl mx-auto p-4">
<div class="bg-white border rounded-[20px] p-6"><h1 class="text-2xl font-bold">🏛️ Exposition Collective OCT 2026</h1><p class="text-sm opacity-60">Thème: Beauté Africaine • 1 compte = 1 vote / oeuvre</p><div class="mt-3 h-2 bg-gray-100 rounded-full"><div class="h-2 bg-yellow-400 rounded-full" style="width:70%"></div></div></div>
<div id="expoGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
</div>
<script>
const arts=[{id:1,t:"Beauté",v:124,img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},{id:2,t:"Renaissance",v:89,img:"https://images.unsplash.com/photo-1554907984-15263bfd63bd?w=400"}];
document.getElementById('expoGrid').innerHTML=arts.map(a=>`<div class="bg-white border rounded-xl overflow-hidden"><img src="${a.img}" class="h-40 w-full object-cover"><div class="p-3"><div class="font-bold text-sm">${a.t}</div><div class="text-xs">${a.v} votes</div><button onclick="voter(${a.id})" class="w-full mt-2 bg-black text-white py-1.5 rounded-full text-xs">Voter 👍</button></div></div>`).join('');
function voter(id){ let v=JSON.parse(localStorage.getItem('votes')||'[]'); if(v.includes(id)) return alert('Déjà voté! 1 compte = 1 vote'); v.push(id); localStorage.setItem('votes',JSON.stringify(v)); alert('Vote comptabilisé!'); location.reload(); }
</script></body></html>
