<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reset</title></head>
<body style="background:#090909;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh">
<div style="background:#141414;border:1px solid gold;padding:30px;border-radius:12px;width:90%;max-width:400px">
<h2 style="color:gold">Nouveau mot de passe</h2>
<input id="p1" type="password" placeholder="Nouveau 10 car min" style="width:100%;padding:12px;margin:8px 0">
<input id="p2" type="password" placeholder="Confirmer" style="width:100%;padding:12px;margin:8px 0">
<button onclick="reset()" style="width:100%;padding:12px;background:gold;border:none;font-weight:bold">Changer</button>
<p id="m"></p></div>
<script>
async function reset(){
let q=new URLSearchParams(location.search);
let token=q.get('token');let userId=q.get('id');
let a=document.getElementById('p1').value;let b=document.getElementById('p2').value;
if(a!==b){document.getElementById('m').innerText='Pas pareil';return}
let r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,userId,newPassword:a})});
let d=await r.json();document.getElementById('m').innerText=d.success?'OK redir...':'Erreur '+d.error;
if(d.success)setTimeout(()=>location.href='/',2000)
}
</script></body></html>
