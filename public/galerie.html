<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie - ZEDMO</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#F9F7F2]"><nav class="bg-white border-b p-3 flex justify-between"><a href="index.html" class="font-bold">ART-ZEDMO</a><div class="flex gap-3 text-sm"><a href="galerie.html" class="font-bold">Galerie</a><a href="exposition.html">Expos</a><a href="encheres.html">Enchères</a></div></nav>
<div class="max-w-7xl mx-auto p-4">
<div class="flex gap-2 mb-4 flex-wrap">
<button onclick="filter('all')" class="bg-black text-white px-4 py-2 rounded-full text-sm">Toutes</button>
<button onclick="filter('Peinture')" class="border px-4 py-2 rounded-full text-sm">Peinture</button>
<button onclick="filter('Sculpture')" class="border px-4 py-2 rounded-full text-sm">Sculpture</button>
<button onclick="filter('Photographie')" class="border px-4 py-2 rounded-full text-sm">Photo</button>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>
<script>
const all=[{id:1,t:"Beauté africaine",c:"Peinture",p:"150k",v:124,img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},{id:2,t:"Renaissance",c:"Sculpture",p:"320k",v:89,img:"https://images.unsplash.com/photo-1554907984-15263bfd63bd?w=400"},{id:3,t:"Lumière",c:"Photographie",p:"80k",v:210,img:"https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=400"},{id:4,t:"Terre Mère",c:"Peinture",p:"200k",v:178,img:"https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=400"}];
function render(list){document.getElementById('grid').innerHTML=list.map(a=>`<a href="oeuvre.html?id=${a.id}" class="bg-white border rounded-xl overflow-hidden"><img src="${a.img}" class="h-40 w-full object-cover"><div class="p-3"><div class="font-bold text-sm">${a.t}</div><div class="text-xs opacity-60">${a.c} • ${a.p} • ❤️${a.v}</div></div></a>`).join('')}
function filter(c){render(c==='all'?all:all.filter(a=>a.c===c))}
render(all);
</script></body></html>
