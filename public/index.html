<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ART-ZEDMO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--or:#D4AF37;--noir:#0A0A0A;}
body{background:var(--noir);color:white;font-family:Inter,sans-serif}
.or{color:var(--or)}.bg-or{background:var(--or)}
.tab-active{color:var(--or)!important;border-top:2px solid var(--or)}
.hidden-tab{display:none!important}
</style>
</head>
<body class="pb-28">

<header class="p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 bg-black z-50">
  <div class="flex items-center gap-2"><div class="w-9 h-9 bg-or text-black font-black flex items-center justify-center rounded">AZ</div><span class="font-bold">ART-ZEDMO</span></div>
  <span class="text-[10px] border border-or px-2 py-1 rounded-full or">EXPO OCT 2026 - LIVE</span>
</header>

<section id="accueil" class="tab">
  <div class="p-6 text-center"><h1 class="text-[32px] font-black">L'art africain<br><span class="or">sans frontière.</span></h1>
  <p class="text-zinc-400 text-[13px] mt-4">Bienvenue sur ART-ZEDMO, première plateforme 100% digital.</p>
  <div class="flex gap-3 justify-center mt-6">
    <button onclick="go('galerie')" class="bg-or text-black px-6 py-3 rounded-full font-bold text-sm">Explorer la Galerie</button>
    <button onclick="go('expos')" class="border border-white px-6 py-3 rounded-full font-bold text-sm">Expo OCT 2026</button>
  </div></div>
</section>

<section id="galerie" class="tab hidden-tab p-4"><h2 class="font-black text-xl">Galerie <span id="countG" class="or"></span></h2><div id="gridG" class="grid grid-cols-2 gap-3 mt-4"></div></section>
<section id="expos" class="tab hidden-tab p-4"><h2 class="font-black text-xl or">Expositions OCT 2026</h2><div id="listExpo" class="mt-4 space-y-2"></div></section>
<section id="encheres" class="tab hidden-tab p-4"><h2 class="font-black text-xl">Enchères LIVE</h2><div id="listEnch" class="mt-4 space-y-3"></div></section>
<section id="compte" class="tab hidden-tab p-4"><h2 class="font-black text-xl">Compte</h2>
<input id="c-nom" placeholder="Nom" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-4">
<input id="c-wa" placeholder="WhatsApp" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-2">
<input id="c-titre" placeholder="Titre oeuvre" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-2">
<input id="c-prix" type="number" placeholder="Prix FCFA" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-2">
<input id="c-img" placeholder="Lien image https://" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-2">
<button onclick="publier()" class="w-full bg-or text-black py-3.5 rounded-full font-black text-sm mt-3">Publier</button><p id="msg" class="text-xs text-center mt-2"></p>
</section>

<nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-zinc-800 flex justify-around py-3 z-50">
  <button onclick="go('accueil')" id="b-accueil" class="flex flex-col items-center text-[10px] tab-active gap-1"><i class="fa-solid fa-house text-[18px]"></i>Accueil</button>
  <button onclick="go('galerie')" id="b-galerie" class="flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-images text-[18px]"></i>Galerie</button>
  <button onclick="go('expos')" id="b-expos" class="flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-landmark text-[18px]"></i>Expos</button>
  <button onclick="go('encheres')" id="b-encheres" class="flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-gavel text-[18px]"></i>Enchères</button>
  <button onclick="go('compte')" id="b-compte" class="flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-user text-[18px]"></i>Compte</button>
</nav>

<script>
function go(id){
  console.log("GO ->",id);
  document.querySelectorAll('.tab').forEach(s=>s.classList.add('hidden-tab'));
  document.getElementById(id).classList.remove('hidden-tab');
  document.querySelectorAll('nav button').forEach(b=>{b.classList.remove('tab-active'); b.classList.add('text-zinc-500')});
  document.getElementById('b-'+id).classList.add('tab-active');
  document.getElementById('b-'+id).classList.remove('text-zinc-500');
  if(id==='galerie') loadG();
  if(id==='expos') loadE();
  if(id==='encheres') loadEn();
  window.scrollTo(0,0);
}
async function loadG(){
  try{const r=await fetch('/api/artworks'); const d=await r.json();
  document.getElementById('countG').innerText=`(${d.length})`;
  document.getElementById('gridG').innerHTML=d.map(a=>`<div class="bg-zinc-900 rounded-xl overflow-hidden"><img src="${a.image||a.images?.[0]||'https://picsum.photos/300'}" class="h-32 w-full object-cover"><div class="p-2"><p class="text-xs font-bold">${a.titre}</p><p class="or text-xs">${a.prix} FCFA • ${a.votesCount||0} votes</p><button onclick="voter('${a._id}')" class="w-full mt-1 bg-white text-black text-[11px] py-1.5 rounded-full">Voter</button></div></div>`).join('') || '<p class="col-span-2 text-center text-zinc-500 py-10">0 oeuvre, publie!</p>';
  }catch(e){document.getElementById('gridG').innerHTML='Erreur API: '+e.message}
}
async function loadE(){
  try{const r=await fetch('/api/expositions/active'); const e=await r.json();
  if(!e._id){document.getElementById('listExpo').innerHTML='<p class="text-sm text-zinc-500">Pas d\'expo active - crée une sur /api/expositions</p>'; return}
  document.getElementById('listExpo').innerHTML=(e.oeuvres||[]).map((a,i)=>`<div class="bg-zinc-900 p-3 rounded-xl flex gap-3 items-center"><b class="or">#${i+1}</b><img src="${a.image||a.images?.[0]||'https://picsum.photos/100'}" class="w-12 h-12 rounded-lg object-cover"><div class="flex-1"><p class="text-sm font-bold">${a.titre}</p><p class="text-xs text-zinc-400">${a.votesCount||0} votes</p></div><button onclick="voter('${a._id}')" class="bg-or text-black px-3 py-1 rounded-full text-xs">Voter</button></div>`).join('');
  }catch(e){document.getElementById('listExpo').innerHTML='Erreur: '+e.message}
}
async function loadEn(){
  try{const r=await fetch('/api/encheres'); const d=await r.json();
  document.getElementById('listEnch').innerHTML=d.map(en=>`<div class="bg-zinc-900 p-4 rounded-2xl"><img src="${en.artwork?.image||'https://picsum.photos/300'}" class="h-40 w-full object-cover rounded-xl"><p class="mt-2 font-bold">${en.artwork?.titre}</p><p class="or font-black">${en.enchereActuelle} FCFA</p><div class="flex gap-2 mt-2"><input id="in-${en._id}" type="number" placeholder="Montant" class="flex-1 bg-black border border-zinc-700 rounded-full px-3 py-2 text-sm"><button onclick="encherir('${en._id}')" class="bg-white text-black px-4 py-2 rounded-full text-sm">Enchérir</button></div></div>`).join('') || '<p class="text-zinc-500 text-sm">Pas d\'enchère</p>';
  }catch(e){document.getElementById('listEnch').innerHTML='Erreur: '+e.message}
}
async function voter(id){
  const wa=prompt('Ton WhatsApp pour voter:'); if(!wa) return;
  const res=await fetch('/api/votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artworkId:id, votant_whatsapp:wa})}).then(r=>r.json());
  alert(res.success? 'Vote OK! Total '+res.total_votes_oeuvre : res.error);
}
async function encherir(id){const m=document.getElementById('in-'+id).value; if(!m) return alert('Montant'); const res=await fetch(`/api/encheres/${id}/encherir`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({montant:m})}).then(r=>r.json()); alert(res.success? 'Enchère OK '+res.nouvelle_enchere : res.error); loadEn()}
async function publier(){
  const body={artiste_nom:document.getElementById('c-nom').value, whatsapp:document.getElementById('c-wa').value, titre:document.getElementById('c-titre').value, prix:document.getElementById('c-prix').value, images:[document.getElementById('c-img').value], ville:'Abomey-Calavi'};
  if(!body.titre||!body.prix||!body.whatsapp) return document.getElementById('msg').innerText='Remplis tout';
  try{
    let u=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom:body.artiste_nom, whatsapp:body.whatsapp, password:'123456'})}).then(r=>r.json());
    let artisteId=u.user?._id||u._id;
    if(!artisteId){const l=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({whatsapp:body.whatsapp, password:'123456'})}).then(r=>r.json()); artisteId=l.user?._id}
    const r=await fetch('/api/artworks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body, artiste:artisteId})}).then(r=>r.json());
    document.getElementById('msg').innerHTML='<span class="text-green-400">Publiée!</span> '+r.lien_viral;
  }catch(e){document.getElementById('msg').innerText=e.message}
}
loadG();
</script>
</body>
</html>
