<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ART-ZEDMO - Pi Pay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>try{ Pi.init({version:"2.0", sandbox:true}); }catch(e){}</script>
<style>:root{--or:#D4AF37;--noir:#0A0A0A}body{background:var(--noir);color:white;font-family:Inter}.or{color:var(--or)}.bg-or{background:var(--or)}.border-or{border-color:var(--or)}.tab-active{color:var(--or)!important;border-top:2px solid var(--or)}.hidden-tab{display:none!important}.eco-loop{border:1px solid #222;background:linear-gradient(180deg,#111,#0A0A0A)}.certif-paper{background:white;color:black}</style>
</head>
<body class="pb-24">
<header class="p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 bg-black/90 z-50"><div class="flex items-center gap-2"><div class="w-9 h-9 bg-or text-black font-black flex items-center justify-center rounded">AZ</div><span class="font-bold tracking-widest">ART-ZEDMO</span></div><span class="text-[10px] bg-zinc-900 border border-or px-2 py-1 rounded-full or">PI PAY LIVE</span></header>

<section id="accueil" class="tab"><div class="p-6 text-center"><h1 class="text-[32px] font-black">L'art africain<br><span class="or">sans frontière.</span></h1><button onclick="go('galerie')" class="bg-or text-black px-6 py-3 rounded-full font-bold text-sm mt-6">Explorer Galerie</button></div></section>
<section id="galerie" class="tab hidden-tab p-4"><h2 class="font-black text-xl">Galerie <span id="countG" class="or text-sm"></span></h2><div id="gridGalerie" class="grid grid-cols-2 gap-3 mt-4"></div></section>
<section id="verifier" class="tab hidden-tab p-4"><h2 class="font-black text-xl">Vérifier</h2><div class="mt-4 flex gap-2"><input id="inputAZM" placeholder="AZM-2026-..." class="flex-1 bg-zinc-900 border rounded-full px-4 py-3 text-sm uppercase"><button onclick="verifierAZM()" class="bg-or text-black px-6 rounded-full font-black">Vérifier</button></div><div id="resultVerif" class="mt-4"></div></section>
<section id="compte" class="tab hidden-tab p-4"><div id="boxCreate" class="bg-white text-black rounded-xl p-6 text-center"><h3 class="font-black">Compte AZ</h3></div></section>

<div id="modalBuyNFT" class="fixed inset-0 bg-black/90 z-[130] hidden flex items-end justify-center"><div class="bg-white text-black w-full rounded-t-[24px] p-6"><div class="flex justify-between"><h3 class="font-black text-sm">Acheter NFT - 100 Pi Testnet</h3><button onclick="closeBuyNFT()" class="w-8 h-8 bg-zinc-100 rounded-full">✕</button></div><p id="buyNFTTitle" class="text-xs mt-2 font-bold"></p><div class="mt-4 space-y-3"><input id="buy-wallet" placeholder="Wallet Pi G..." class="w-full bg-zinc-100 border rounded-xl px-4 py-3 text-sm" value="GAW2HX5BWU7PXFPZ43JYCGKSISYDTGCN"><input id="buy-name" placeholder="Nom" class="w-full bg-zinc-100 border rounded-xl px-4 py-3 text-sm" value="Zedmo"><div class="bg-yellow-50 border border-yellow-300 p-3 rounded-xl text-[11px]">Paiement: 100 Pi Test via Pi Browser<br>Wallet dev: GC4GS...NI2PC<br>5% royalties → Artiste</div><button onclick="confirmBuyNFT()" id="btnConfirmBuy" class="w-full bg-black text-white py-3.5 rounded-full font-black">Payer 100 Pi avec Pi Browser</button><p id="msgBuyNFT" class="text-center text-xs font-bold"></p><p class="text-[9px] text-center text-zinc-500">Ouvre dans Pi Browser</p></div></div></div>
<div id="modalCertificat" class="fixed inset-0 bg-black/95 z-[120] hidden flex items-center justify-center p-4"><div class="certif-paper w-full max-w-[400px] rounded-xl p-6 relative"><button onclick="closeModalCertif()" class="absolute top-2 right-2 w-8 h-8 bg-zinc-100 rounded-full">✕</button><div id="certifContent"></div><div id="qrcode" class="flex justify-center mt-4"></div></div></div>

<nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-zinc-800 flex justify-around py-2.5 z-50">
<button onclick="go('accueil')" id="nav-accueil" class="tab-btn tab-active flex flex-col items-center text-[10px] gap-1"><i class="fa-solid fa-house"></i>Accueil</button>
<button onclick="go('galerie')" id="nav-galerie" class="tab-btn flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-images"></i>Galerie</button>
<button onclick="go('verifier')" id="nav-verifier" class="tab-btn flex flex-col items-center text-[10px] text-zinc-500 gap-1"><i class="fa-solid fa-qrcode"></i>Vérif</button>
</nav>

<script>
let role='artiste', currentUser=JSON.parse(localStorage.getItem('AZ_USER')||'null'), buyCurrentId=null, buyCurrentAzm='';
function go(id){document.querySelectorAll('.tab').forEach(s=>s.classList.add('hidden-tab'));document.getElementById(id).classList.remove('hidden-tab');document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('tab-active');b.classList.add('text-zinc-500')});document.getElementById('nav-'+id)?.classList.add('tab-active');if(id==='galerie')loadGalerie();window.scrollTo(0,0);}
function closeBuyNFT(){document.getElementById('modalBuyNFT').classList.add('hidden');}
function closeModalCertif(){document.getElementById('modalCertificat').classList.add('hidden');}
async function loadGalerie(){
  const arts=await fetch('/api/artworks').then(r=>r.json()).catch(()=>[]);
  const nfts=await fetch('/api/nft').then(r=>r.json()).catch(()=>[]);
  const merged=[...nfts.map(n=>({...n, images:[n.imageUrl], isNFT:true})),...arts];
  document.getElementById('countG').innerText=merged.length+' oeuvres';
  document.getElementById('gridGalerie').innerHTML=merged.map(a=>`<div class="bg-zinc-900 rounded-xl overflow-hidden border ${a.isNFT?'border-or/30':'border-zinc-800'}"><img src="${a.images?.[0]||a.image||a.imageUrl||'https://via.placeholder.com/300'}" class="h-32 w-full object-cover"><div class="p-2"><p class="text-sm font-bold truncate">${a.titre}</p><p class="or text-xs">${a.azmId||''}</p><button onclick="acheterNFT('${a._id}','${a.azmId||''}','${(a.titre||'').replace(/'/g,'')}')" class="bg-or text-black py-2 rounded-full text-[10px] font-black w-full mt-2">Acheter NFT 100 Pi</button></div></div>`).join('');
}
function acheterNFT(id, azmId, titre){
  buyCurrentId=id; buyCurrentAzm=azmId||id;
  document.getElementById('buyNFTTitle').innerText=`"${titre}" • ${buyCurrentAzm} • 100 Pi`;
  document.getElementById('modalBuyNFT').classList.remove('hidden');
}
async function confirmBuyNFT(){
  const wallet=document.getElementById('buy-wallet').value.trim();
  const buyer=document.getElementById('buy-name').value.trim()||'Collectionneur Pi';
  const msg=document.getElementById('msgBuyNFT');
  const btn=document.getElementById('btnConfirmBuy');
  if(wallet.length<10){ msg.innerText='❌ Wallet G... requis'; return; }
  if(!window.Pi){ msg.innerText='❌ Ouvre dans Pi Browser'; return; }
  btn.disabled=true; btn.innerText='⏳ Auth Pi...';
  try{
    const scopes=['username','payments'];
    const auth=await window.Pi.authenticate(scopes, (p)=>{console.log('incomplete',p)});
    console.log('auth ok', auth.user.username);
    msg.innerText='⏳ Création paiement 100 Pi...';
    await window.Pi.createPayment({ amount:100, memo:`NFT ${buyCurrentAzm} ART-ZEDMO`, metadata:{ artworkId:buyCurrentId, azmId:buyCurrentAzm, buyer, wallet } },{
      onReadyForServerApproval: async (paymentId)=>{
        msg.innerText='⏳ Approbation serveur...';
        const r=await fetch('/api/pay/pi/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId})});
        if(!r.ok) throw new Error('Approve fail');
      },
      onReadyForServerCompletion: async (paymentId, txid)=>{
        msg.innerText=`⏳ Validation ${txid.slice(0,8)}...`;
        const r=await fetch('/api/pay/pi/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId, txid, artworkId:buyCurrentId, buyer, wallet})});
        const j=await r.json(); if(j.error) throw new Error(j.error);
        msg.innerHTML=`<span class="text-green-600">✅ Payé! ${txid.slice(0,10)}</span>`;
        setTimeout(()=>{ closeBuyNFT(); alert(`✅ NFT LIVRÉ!\nTx: ${txid}\nID: ${j.azmId}\n100 Pi sur GC4GS...NI2PC`); window.open(j.downloadUrl,'_blank'); loadGalerie(); },800);
      },
      onCancel: ()=>{ msg.innerText='❌ Annulé'; btn.disabled=false; btn.innerText='Payer 100 Pi avec Pi Browser'; },
      onError: (e)=>{ msg.innerText='❌ '+e; btn.disabled=false; btn.innerText='Payer 100 Pi avec Pi Browser'; }
    });
  }catch(e){ msg.innerText='❌ '+e.message; btn.disabled=false; btn.innerText='Payer 100 Pi avec Pi Browser'; }
}
async function verifierAZM(){const id=document.getElementById('inputAZM').value.trim().toUpperCase();const box=document.getElementById('resultVerif');box.innerHTML='Vérif...';try{const d=await fetch('/api/artworks/verify/'+id).then(r=>r.json());if(d.error) throw new Error(d.error);box.innerHTML=`<div class="bg-green-900/20 border border-green-600 rounded-xl p-4"><p class="text-green-400 font-black">✅ ${d.titre}</p><p class="text-xs">ID: ${d.azmId}<br>Tx: ${d.txHash}</p></div>`}catch(e){box.innerHTML=`<p class="text-red-400 text-xs">❌ ${e.message}</p>`}}
loadGalerie();
</script>
</body>
</html>
